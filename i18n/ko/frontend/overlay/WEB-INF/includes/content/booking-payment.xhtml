<div xmlns="http://www.w3.org/1999/xhtml"
     xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:ice="http://www.icesoft.com/icefaces/component"
        xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:gate11="http://www.dynatrace.com/gate11/taglib"
        class="mainBox">

        <h1 class="mainBoxHeader">예약 진행</h1>
        <gate11:bookingStepIndicator activeStep="3"/>

        <ice:panelGroup styleClass="bookPaymentBox">

			<p class="heading">신용카드 정보
				<ice:graphicImage value="img/booking/Booking_transaction_VersiSign.png" />
			</p>
			<ice:outputText value="(SSL 암호화 보안 결제)"/>

			<ice:panelGrid columns="2" cellspacing="3">
				<ice:outputLabel for="creditCardType" value="카드 종류" styleClass="required"/>
				<ice:panelGroup>
					<ice:selectOneMenu id="creditCardType" value="#{bookingRequestBean.creditCardType}" styleClass="bookPaymentSelectLarge">
						<f:selectItem itemLabel="VISA" />
						<f:selectItem itemLabel="MasterCard" />
						<f:selectItem itemLabel="Diner's Club" />
						<f:selectItem itemLabel="AmEx" />
					</ice:selectOneMenu>
					<ice:graphicImage value="img/booking/Booking_transaction_creditcards.png" />
				</ice:panelGroup>

				<ice:outputLabel for="creditCardNumber" value="카드 번호" styleClass="required"/>
				<ice:inputText id="creditCardNumber" value="#{bookingRequestBean.creditCardNumber}" styleClass="bookPaymentInputLarge"/>

				<ice:outputLabel for="creditCardOwner" value="카드 소유자 이름" styleClass="required"/>
				<ice:panelGroup>
					<ice:inputText id="creditCardOwner" value="#{bookingRequestBean.creditCardOwner}" styleClass="bookPaymentInputLarge"/>
					<ice:outputText value=" (카드에 표기된 그대로)" />
				</ice:panelGroup>

				<ice:outputLabel for="expirationMonth" value="유효 기간" styleClass="required"/>
				<ice:panelGroup>
					<ice:selectOneMenu id="expirationMonth" value="#{bookingRequestBean.expirationMonth}" styleClass="bookPaymentSelectLarge">
						<f:selectItem itemLabel="월" itemValue=""/>
						<f:selectItem itemLabel="1월" itemValue="January" />
						<f:selectItem itemLabel="2월" itemValue="February" />
						<f:selectItem itemLabel="3월" itemValue="March" />
						<f:selectItem itemLabel="4월" itemValue="April" />
						<f:selectItem itemLabel="5월" itemValue="May" />
						<f:selectItem itemLabel="6월" itemValue="June" />
						<f:selectItem itemLabel="7월" itemValue="July" />
						<f:selectItem itemLabel="8월" itemValue="August" />
						<f:selectItem itemLabel="9월" itemValue="September" />
						<f:selectItem itemLabel="10월" itemValue="October" />
						<f:selectItem itemLabel="11월" itemValue="November" />
						<f:selectItem itemLabel="12월" itemValue="December" />
					</ice:selectOneMenu>
					<ice:selectOneMenu id="expirationYear" value="#{bookingRequestBean.expirationYear}" styleClass="bookPaymentSelectSmall">
						<f:selectItems value="#{bookingRequestBean.validYears}"/>
					</ice:selectOneMenu>
					<ice:outputText value=" (유효 기간을 정확히 선택하세요)"/>
				</ice:panelGroup>

				<ice:outputLabel for="verificationNumber" value="CVC 번호" styleClass="required"/>
				<ice:panelGroup>
					<ice:inputText id="verificationNumber" value="#{bookingRequestBean.verificationNumber}" styleClass="bookPaymentInputSmall"/>
					<ice:graphicImage value="img/booking/Booking_transaction_creditcode.png"/>
					<ice:outputText value=" (카드 뒷면의 3~4자리 숫자)"/>
				</ice:panelGroup>
			</ice:panelGrid>

		   <!--  needed for problem pattern "TravellersError500" -->
		   <ice:outputFormat value="#{dataBean.costFormat}" style="display:none">
				<f:param value="#{bookingBean.accountMap[bookingBean.selectedJourney].totalCosts}"/>
			</ice:outputFormat>

			<ice:panelGroup styleClass="bookPaymentInputError" rendered="#{bookingRequestBean.inputError}">
				<ice:messages />
			</ice:panelGroup>
        </ice:panelGroup>

		<div class="required">
			<ice:outputText value="필수 항목" />
		</div>
		<div class="privacyPolicy">
			<ice:commandButton value="개인정보처리방침 이미지" image="img/privacypolicy_lock.png" action="#{bookingRequestBean.fillMock}"/>
			<ice:commandLink value="개인정보처리방침" action="#{bookingRequestBean.fillMock}" id="fillMock"/>
		</div>
		<h:link id="bookPaymentBack" outcome="orange-booking-review" includeViewParams="true" class="commonButton grayButton1 mainBoxButton backButton" value="이전" />
		<ice:commandButton id="bookPaymentNext" styleClass="commonButton orangeButton1 mainBoxButton nextButton" value="다음" action="#{bookingRequestBean.validatePayment}" rendered="#{bookingBean.stateValid}"/>
</div>
