<div    xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:ice="http://www.icesoft.com/icefaces/component"
        xmlns:ui="http://java.sun.com/jsf/facelets"
        xmlns:fb="http://www.facebook.com/2008/fbml"
        xmlns:og="http://ogp.me/ns#"
        style="margin-left:150px;margin-right:150px;margin-top:100px;">

페이지에 facebook-javascript 요소를 포함할지 선택하세요. 현재 상태: 

	<ice:outputLabel id="facebookEnabled" style="color:red" value="사용" rendered="#{facebookBean.facebookEnabled}"/>
	<ice:outputLabel id="facebookDisabled" style="color:red" value="사용 안 함" rendered="#{not facebookBean.facebookEnabled}"/>:

	<br/>
		
	<ice:panelGroup>
		<ice:selectOneRadio id="facebookStateRadio"
			value="#{facebookBean.facebookState}"
			valueChangeListener="#{facebookBean.effectChangeListener}"
			partialSubmit="true">
			<f:selectItems id="facebookStateRadioItms"
				value="#{facebookBean.facebookStateItems}" />
		</ice:selectOneRadio>
	</ice:panelGroup>

	facebook plugin 상태: 
	<ice:outputLabel id="facebookPluginEnabled" style="color:red" value="사용" rendered="#{facebookBean.facebookGloballyEnabled}"/>
	<ice:outputLabel id="facebookPluginDisabled" style="color:red" value="사용 안 함" rendered="#{not facebookBean.facebookGloballyEnabled}"/>.

	facebook·twitter-javascript를 포함하려면 두 항목 모두 사용으로 설정해야 합니다
</div>
