# ALB 1개를 공유(group.name)하고 리스너 포트로 Classic / Angular 를 분리 → 별도 DNS 없이 docker-compose 와 동일한 접속 방식
#   http://<ALB-DNS>/        → Classic frontend
#   http://<ALB-DNS>:9079/   → Angular frontend
# target-type: ip → Pod IP 로 직접 전달 (Service 를 NodePort 로 바꿀 필요 없음)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easytravel-classic
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing        # [CUSTOMIZE] 내부 전용이면 internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: easytravel
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
    # alb.ingress.kubernetes.io/inbound-cidrs: "x.x.x.x/32"  # [CUSTOMIZE] 접속 허용 IP 제한 권장
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: www
                port: { name: classic }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easytravel-angular
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: easytravel
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 9079}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: www
                port: { name: angular }
