# easyTravel MongoDB — 이미지 안에 사전 적재된 DB 를 기동 시마다 풀어서 사용하므로 PVC 불필요(emptyDir 성격)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64       # easyTravel 이미지는 amd64 전용 (Graviton/ARM 노드 회피)
      containers:
        - name: mongodb
          image: dynatrace/easytravel-mongodb
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }  # 원본 100Mi 는 OOMKilled 발생 가능
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
