apiVersion: v1
kind: ConfigMap
metadata:
  name: easytravel-config
data:
  # "APM" = Dynatrace, "Classic" = AppMon
  ET_APM_SERVER_DEFAULT: "APM"
  # 내부 서비스 주소 (Service 이름 기준)
  ET_DATABASE_LOCATION: "mongodb:27017"
  ET_BACKEND_URL: "http://backend:8080"
  ET_BACKEND_LOCATION: "backend:8080"
  ET_FRONTEND_LOCATION: "frontend:8080"
  ET_ANGULAR_FRONTEND_LOCATION: "angular-frontend:8080"
  # Problem pattern 순환 목록 (loadgen-classic 이 10분 간격으로 하나씩 on/off)
  ET_PROBLEMS: "BadCacheSynchronization,CPULoad,DatabaseCleanup,DatabaseSlowdown,FetchSizeTooSmall,JourneySearchError404,JourneySearchError500,LoginProblems,MobileErrors,TravellersOptionBox"
  # Davis 가 baseline 을 학습할 시간을 주려면 7500(초) 권장 → components/problem-patterns-delayed 사용
  ET_PROBLEMS_DELAY: "0"
---
# 데모용 기본 계정 (easyTravel MongoDB 이미지에 내장된 값). 운영 목적이면 외부 Secret 관리로 대체
apiVersion: v1
kind: Secret
metadata:
  name: easytravel-mongodb
type: Opaque
stringData:
  ET_MONGO_AUTH_DB: "admin"
  ET_DATABASE_USER: "etAdmin"
  ET_DATABASE_PASSWORD: "adminadmin"
