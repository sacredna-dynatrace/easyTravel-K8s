apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-content-creator
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-content-creator
        app.kubernetes.io/component: database-init
      annotations:
        oneagent.dynatrace.com/inject: "false"
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: content-creator
          image: dynatrace/easytravel-mongodb-content-creator
          env:
            - name: ET_DATABASE_LOCATION
              valueFrom: { configMapKeyRef: { name: easytravel-config, key: ET_DATABASE_LOCATION } }
          envFrom:
            - secretRef: { name: easytravel-mongodb }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
