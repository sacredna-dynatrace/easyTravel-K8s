# Problem pattern 제어 패널 — nginx 설정 (http 컨텍스트에 include 됨)
#   GET  /api/enabled                    → 켜진 plugin 목록 (getEnabledPluginNames, SOAP XML)
#   POST /api/register?name=<Pattern>    → registerPlugins (frontend plugin 은 등록 후 켜야 함)
#   POST /api/set?name=<Pattern>&enabled=true|false → setPluginEnabled
# 허용 목록에 없는 pattern 이름·값은 400. 그 외 경로는 404.

map $arg_name $pp_name_ok {
    default 0;
    ~^(BadCacheSynchronization|CPULoad|DatabaseCleanup|DatabaseSlowdown|FetchSizeTooSmall|JourneySearchError404|JourneySearchError500|LargeMemoryLeak|LoginProblems|MobileErrors|TravellersOptionBox)$ 1;
}
map $arg_enabled $pp_enabled_ok {
    default 0;
    true    1;
    false   1;
}

server {
    listen 8080;
    server_tokens off;

    auth_basic           "easyTravel Problem Panel";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
    proxy_method          GET;            # backend Axis2 REST 는 GET + query string
    proxy_pass_request_body off;
    proxy_set_header      Content-Length "";
    proxy_set_header      Host backend;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /api/enabled {
        limit_except GET { deny all; }
        rewrite ^ /services/ConfigurationService/getEnabledPluginNames? break;
        proxy_pass http://backend:8080;
    }

    location = /api/register {
        limit_except POST { deny all; }
        if ($pp_name_ok = 0) { return 400 "invalid pattern\n"; }
        rewrite ^ /services/ConfigurationService/registerPlugins?pluginData=$arg_name? break;
        proxy_pass http://backend:8080;
    }

    location = /api/set {
        limit_except POST { deny all; }
        if ($pp_name_ok = 0)    { return 400 "invalid pattern\n"; }
        if ($pp_enabled_ok = 0) { return 400 "invalid value\n"; }
        rewrite ^ /services/ConfigurationService/setPluginEnabled?name=$arg_name&enabled=$arg_enabled? break;
        proxy_pass http://backend:8080;
    }

    location / {
        return 404;
    }
}
