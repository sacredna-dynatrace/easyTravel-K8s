# easyTravel 데모용 EKS 클러스터 (eksctl)
#   생성: eksctl create cluster -f kubernetes/cluster/eks/cluster.yaml   (또는 up.sh / up.ps1)
#   삭제: down.sh / down.ps1  (ALB 를 먼저 지운 뒤 클러스터 삭제)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: easytravel-demo            # [CUSTOMIZE] 클러스터 이름 (up/down 스크립트의 CLUSTER 와 같아야 함)
  region: ap-northeast-2           # 서울
  version: "1.35"                  # eksctl 0.230 이 지원하는 최신 버전
  tags:
    project: easytravel-demo
    owner: sacredna                # [CUSTOMIZE] 비용 추적용 태그

# AWS Load Balancer Controller 가 IRSA 로 IAM 권한을 받기 위해 필요
iam:
  withOIDC: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy

managedNodeGroups:
  - name: ng-amd64
    instanceType: m5.xlarge        # 4 vCPU / 16 GiB. easyTravel 이미지는 amd64 전용 → Graviton(m7g 등) 사용 금지
    amiFamily: AmazonLinux2023
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 50
    labels:
      workload: easytravel
    # spot: true                   # [CUSTOMIZE] 비용 절감용. 데모 중 노드가 회수될 수 있음
    # instanceTypes: ["m5.xlarge", "m5a.xlarge", "m6i.xlarge"]   # spot 사용 시 여러 타입 지정 권장

# 컨트롤 플레인 로그는 데모에서는 끔 (CloudWatch 비용 절감)
cloudWatch:
  clusterLogging:
    enableTypes: []
